name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find existing Claude review
        uses: peter-evans/find-comment@v4
        id: find_claude_comment
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body-includes: '<!-- claude-code-review -->'

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --allowed-tools "Read,Glob,Grep,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(git diff:*),Bash(git log:*),Bash(gh pr comment:*),Bash(gh api:*)"
          prompt: |
            Review PR #${{ github.event.pull_request.number }} in ${{ github.repository }}.
            Base branch: ${{ github.event.pull_request.base.ref }}

            Use `git diff origin/${{ github.event.pull_request.base.ref }}...HEAD` to see the changes.
            Read relevant source files for context when needed.

            Analyze the diff for:
            - Bugs, logic errors, and edge cases
            - Security issues
            - Performance concerns
            - Missing error handling

            Be concise. Only report real, actionable issues. Skip nitpicks and style suggestions.
            If the code looks good, say so briefly.

            Then publish your review as a SINGLE sticky PR comment. Build the comment body
            so it begins with EXACTLY these two lines (including the HTML comment marker):
            <!-- claude-code-review -->
            ## Claude Code Review

            Write that body to a temporary file first (to preserve markdown and newlines),
            then post it — maintaining only ONE such comment on the PR:
            - Existing review comment id: "${{ steps.find_claude_comment.outputs.comment-id }}"
            - If that id is non-empty, UPDATE the existing comment in place:
                gh api --method PATCH \
                  /repos/${{ github.repository }}/issues/comments/<id> \
                  -F body=@<tmpfile>
            - If it is empty, CREATE a new comment:
                gh pr comment ${{ github.event.pull_request.number }} --body-file <tmpfile>
            Post the comment yourself with these commands; do not rely on a later workflow step.
