name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find existing Claude review
        uses: peter-evans/find-comment@v4
        id: find_claude_comment
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body-includes: '<!-- claude-code-review -->'

      # The review agent is read-only: it can read the diff and Write the review
      # to a file, but has NO GitHub API access. Posting is done by the trusted
      # peter-evans step below, so untrusted PR content can't steer the agent into
      # arbitrary gh api calls (comment deletion, closing PRs, etc.).
      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --allowed-tools "Read,Glob,Grep,Write,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(git diff:*),Bash(git log:*)"
          prompt: |
            Review PR #${{ github.event.pull_request.number }} in ${{ github.repository }}.
            Base branch: ${{ github.event.pull_request.base.ref }}

            Use `git diff origin/${{ github.event.pull_request.base.ref }}...HEAD` to see the changes.
            Read relevant source files for context when needed.

            Analyze the diff for:
            - Bugs, logic errors, and edge cases
            - Security issues
            - Performance concerns
            - Missing error handling

            Be concise. Only report real, actionable issues. Skip nitpicks and style suggestions.
            If the code looks good, say so briefly.

            Write your COMPLETE review as Markdown to the file
            ${{ runner.temp }}/claude-review.md using the Write tool. Do NOT attempt to
            post a PR comment yourself — a later workflow step publishes that file.
            The file MUST begin with EXACTLY these two lines (including the HTML comment):
            <!-- claude-code-review -->
            ## Claude Code Review

      - name: Read review output
        id: review_body
        run: |
          FILE="${{ runner.temp }}/claude-review.md"
          if [ -s "$FILE" ]; then
            {
              echo 'body<<CLAUDE_REVIEW_EOF'
              cat "$FILE"
              echo 'CLAUDE_REVIEW_EOF'
            } >> "$GITHUB_OUTPUT"
          else
            echo "No claude-review.md produced; skipping comment."
            echo 'skip=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Post or update Claude review
        if: steps.review_body.outputs.skip != 'true'
        uses: peter-evans/create-or-update-comment@v5
        with:
          comment-id: ${{ steps.find_claude_comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          body: ${{ steps.review_body.outputs.body }}
          edit-mode: replace
